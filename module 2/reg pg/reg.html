<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Page</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .register-box {
            width: 450px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .register-box h1 {
            text-align: center;
            color: #5b4bb7;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .gender {
            margin-bottom: 15px;
        }

        .gender label {
            margin-right: 15px;
        }

        .terms {
            margin: 15px 0;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #5a67d8;
        }

        .login {
            text-align: center;
            margin-top: 18px;
        }

        .login a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="register-box">

        <h1>Create Account</h1>

        <form>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="gender">
                <label>Gender:</label>

                <input type="radio" name="gender">
                <label>Male</label>

                <input type="radio" name="gender">
                <label>Female</label>

                <input type="radio" name="gender">
                <label>Other</label>
            </div>

            <div class="input-group">
                <label>Course</label>

                <select>
                    <option>Select Course</option>
                    <option>B.Tech</option>
                    <option>B.E</option>
                    <option>B.Sc</option>
                    <option>BCA</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" required>
            </div>

            <div class="terms">
                <input type="checkbox" required>
                <label>I agree to the Terms & Conditions</label>
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

            <div class="login">
                <p>Already have an account?
                    <a href="#">Login</a>
                </p>
            </div>

        </form>

    </div>

</body>
</html>
